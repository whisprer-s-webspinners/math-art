<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Möbius Aurora</title>
  <style>
    :root {
      --bg: #03040b;
      --fg: #e7e4da;
      --muted: #9b97a6;
      --line: #2c2a38;
      --gold: #e4c98a;
      --font-serif: "Iowan Old Style", Palatino, "Palatino Linotype", "Times New Roman", serif;
      --font-sans: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      --font-mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .vignette {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse at 50% 42%,
        transparent 42%,
        color-mix(in oklab, var(--bg) 62%, transparent) 100%
      );
    }
    header {
      pointer-events: none;
      position: fixed;
      top: 0;
      left: 0;
      max-width: 20rem;
      padding: 1.25rem 1.5rem;
      z-index: 2;
    }
    header .kicker {
      margin: 0;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
    }
    header h1 {
      margin: 0.25rem 0 0;
      font-family: var(--font-serif);
      font-weight: 500;
      font-style: italic;
      font-size: clamp(2rem, 5vw, 2.75rem);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 0.75rem 0 0;
      font-size: 0.875rem;
      line-height: 1.4;
      color: var(--muted);
      max-width: 16rem;
    }
    .panel {
      position: fixed;
      bottom: 0;
      left: 0;
      width: min(100%, 20rem);
      padding: 1.25rem 1.5rem;
      z-index: 2;
    }
    .eq {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      line-height: 1.55;
      color: var(--muted);
    }
    .eq .accent { color: color-mix(in oklab, var(--fg) 80%, transparent); }
    .row {
      margin-top: 0.9rem;
    }
    .row label {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .row label span:last-child {
      font-variant-numeric: tabular-nums;
      color: var(--fg);
    }
    input[type="range"] {
      appearance: none;
      width: 100%;
      height: 2.5rem;
      margin: 0;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"]:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 1px;
      background: var(--line);
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 1rem;
      height: 1rem;
      margin-top: -0.47rem;
      border-radius: 999px;
      background: var(--gold);
      border: 2px solid var(--bg);
    }
    input[type="range"]::-moz-range-track {
      height: 1px;
      background: var(--line);
    }
    input[type="range"]::-moz-range-thumb {
      width: 1rem;
      height: 1rem;
      border: 2px solid var(--bg);
      border-radius: 999px;
      background: var(--gold);
    }
    .buttons {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.65rem;
    }
    button {
      flex: 1;
      min-height: 2.75rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: color-mix(in oklab, var(--bg) 80%, transparent);
      color: var(--fg);
      font: inherit;
      font-size: 0.875rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    button:hover { border-color: color-mix(in oklab, var(--gold) 40%, var(--line)); }
    button:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }
    .hint {
      margin: 0.75rem 0 0;
      font-size: 0.72rem;
      color: var(--muted);
    }
    @media (max-width: 420px) {
      header, .panel { padding: 1rem; }
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header>
    <p class="kicker">A single surface</p>
    <h1>Möbius</h1>
    <p>One side, one edge. It turns slowly while a wave of colour travels the same parameters.</p>
  </header>

  <section class="panel" aria-label="Motion">
    <div class="eq">
      <div>x = (1 + v cos(u/2)) cos u</div>
      <div>y = (1 + v cos(u/2)) sin u</div>
      <div>z = v sin(u/2)</div>
      <div class="accent">c = ½ (sin(9u + 7v + φ) + cos(13u − 11v − φ))</div>
    </div>

    <div class="row">
      <label>
        <span>Turn</span>
        <span id="turnLabel">one turn · 46s</span>
      </label>
      <input id="spin" type="range" min="0" max="0.785" step="0.001" value="0.137" />
    </div>
    <div class="row">
      <label>
        <span>Drift</span>
        <span id="driftLabel">along the strip</span>
      </label>
      <input id="flow" type="range" min="0" max="0.55" step="0.001" value="0.11" />
    </div>
    <div class="buttons">
      <button type="button" id="pauseBtn">Pause</button>
      <button type="button" id="resetBtn">Reset</button>
    </div>
    <p class="hint">Drag to look. Scroll to come closer. Space pauses.</p>
  </section>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"
    }
  }
  </script>
  <script type="module">
import * as THREE from "three";

const HALF = 0.48;
const TWO_PI = Math.PI * 2;
const INITIAL_AZIMUTH = 0.62;
const INITIAL_POLAR = Math.PI / 2 - (28 * Math.PI) / 180;

/* Matplotlib-style twilight, cyclic */
const TWILIGHT = [
  [0.0, 0.137, 0.071, 0.243],
  [0.08, 0.31, 0.11, 0.45],
  [0.16, 0.58, 0.17, 0.5],
  [0.24, 0.8, 0.3, 0.47],
  [0.32, 0.91, 0.5, 0.45],
  [0.4, 0.94, 0.73, 0.55],
  [0.48, 0.86, 0.87, 0.72],
  [0.56, 0.58, 0.85, 0.8],
  [0.64, 0.26, 0.68, 0.76],
  [0.72, 0.12, 0.44, 0.64],
  [0.8, 0.09, 0.24, 0.48],
  [0.88, 0.09, 0.12, 0.33],
  [0.94, 0.11, 0.075, 0.26],
  [1.0, 0.137, 0.071, 0.243],
];

function smooth(u) {
  return u * u * (3 - 2 * u);
}

function twilight(t) {
  const x = ((t % 1) + 1) % 1;
  let i = 0;
  while (i < TWILIGHT.length - 2 && TWILIGHT[i + 1][0] < x) i++;
  const a = TWILIGHT[i];
  const b = TWILIGHT[i + 1];
  const u = smooth((x - a[0]) / (b[0] - a[0]));
  return [a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u, a[3] + (b[3] - a[3]) * u];
}

function mobiusPoint(u, v) {
  const c = Math.cos(u * 0.5);
  const R = 1 + v * c;
  const x = R * Math.cos(u);
  const y = R * Math.sin(u);
  const z = v * Math.sin(u * 0.5);
  // Y-up: math (x,y,z) → (x, z, -y)
  return [x, z, -y];
}

function buildStrip(nu, nv) {
  const count = nu * nv;
  const positions = new Float32Array(count * 3);
  const paramU = new Float32Array(count);
  const paramV = new Float32Array(count);

  for (let i = 0; i < nu; i++) {
    const u = (i / nu) * TWO_PI;
    for (let j = 0; j < nv; j++) {
      const v = -HALF + (j / (nv - 1)) * (HALF * 2);
      const [x, y, z] = mobiusPoint(u, v);
      const k = i * nv + j;
      positions[k * 3] = x;
      positions[k * 3 + 1] = y;
      positions[k * 3 + 2] = z;
      paramU[k] = u;
      paramV[k] = v;
    }
  }

  const indices = new Uint32Array(nu * (nv - 1) * 6);
  let p = 0;
  for (let i = 0; i < nu; i++) {
    const i2 = (i + 1) % nu;
    const wrap = i2 === 0;
    for (let j = 0; j < nv - 1; j++) {
      const a = i * nv + j;
      const c = i * nv + j + 1;
      const b = wrap ? nv - 1 - j : i2 * nv + j;
      const d = wrap ? nv - 1 - (j + 1) : i2 * nv + j + 1;
      indices[p++] = a;
      indices[p++] = b;
      indices[p++] = d;
      indices[p++] = a;
      indices[p++] = d;
      indices[p++] = c;
    }
  }
  return { positions, paramU, paramV, indices };
}

const vertexShader = /* glsl */ `
attribute float aU;
attribute float aV;
varying float vU;
varying float vV;
varying vec3 vN;
varying vec3 vWorld;

void main() {
  vU = aU;
  vV = aV;
  float u = aU;
  float v = aV;
  float c = cos(u * 0.5);
  float s = sin(u * 0.5);
  float cu = cos(u);
  float su = sin(u);
  float R = 1.0 + v * c;
  float Ru = -0.5 * v * s;
  vec3 dPu = vec3(Ru * cu - R * su, Ru * su + R * cu, 0.5 * v * c);
  vec3 dPv = vec3(c * cu, c * su, s);
  vec3 nMath = cross(dPu, dPv);
  float nLen = length(nMath);
  vec3 nUnit = nLen > 1e-5 ? nMath / nLen : vec3(0.0, 0.0, 1.0);
  vec3 nYup = vec3(nUnit.x, nUnit.z, -nUnit.y);
  vN = normalize(mat3(modelMatrix) * nYup);
  vec4 world = modelMatrix * vec4(position, 1.0);
  vWorld = world.xyz;
  gl_Position = projectionMatrix * viewMatrix * world;
}
`;

const fragmentShader = /* glsl */ `
uniform float uPhase;
uniform sampler2D uMap;
varying float vU;
varying float vV;
varying vec3 vN;
varying vec3 vWorld;

void main() {
  float field = 0.5 * (
    sin(9.0 * vU + 7.0 * vV + uPhase) +
    cos(13.0 * vU - 11.0 * vV - uPhase)
  );
  float t = clamp(field * 0.5 + 0.5, 0.0, 1.0);
  vec3 base = texture2D(uMap, vec2(fract(t + 0.5), 0.5)).rgb;
  vec3 N = normalize(vN);
  vec3 V = normalize(cameraPosition - vWorld);
  vec3 L = normalize(vec3(0.42, 0.86, 0.28));
  float ndl = abs(dot(N, L));
  float ndv = abs(dot(N, V));
  float rim = pow(1.0 - ndv, 2.05);
  float edge = smoothstep(0.26, 0.48, abs(vV));
  vec3 col = base * (0.8 + 0.22 * ndl);
  col += base * rim * 0.42;
  col += vec3(0.95, 0.86, 0.7) * edge * (0.1 + rim * 0.38);
  gl_FragColor = vec4(col, 1.0);
}
`;

const stage = document.getElementById("stage");
const spinEl = document.getElementById("spin");
const flowEl = document.getElementById("flow");
const turnLabel = document.getElementById("turnLabel");
const driftLabel = document.getElementById("driftLabel");
const pauseBtn = document.getElementById("pauseBtn");
const resetBtn = document.getElementById("resetBtn");

const settings = {
  spin: Number(spinEl.value),
  flow: Number(flowEl.value),
  paused: false,
};

function turnText(spin) {
  if (spin < 0.008) return "still";
  const seconds = Math.round(TWO_PI / spin);
  if (seconds >= 90) return `one turn · ${Math.round(seconds / 60)} min`;
  return `one turn · ${seconds}s`;
}

function syncLabels() {
  turnLabel.textContent = turnText(settings.spin);
  driftLabel.textContent = settings.flow < 0.01 ? "still" : "along the strip";
}
syncLabels();

spinEl.addEventListener("input", () => {
  settings.spin = Number(spinEl.value);
  syncLabels();
});
flowEl.addEventListener("input", () => {
  settings.flow = Number(flowEl.value);
  syncLabels();
});
pauseBtn.addEventListener("click", () => {
  settings.paused = !settings.paused;
  pauseBtn.textContent = settings.paused ? "Play" : "Pause";
  kick();
});
resetBtn.addEventListener("click", () => {
  resetView = true;
  kick();
});
window.addEventListener("keydown", (e) => {
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  if (e.code === "Space" && tag === "BUTTON") return;
  if (e.code === "Space") {
    e.preventDefault();
    settings.paused = !settings.paused;
    pauseBtn.textContent = settings.paused ? "Play" : "Pause";
    kick();
  }
});

if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  settings.paused = true;
  pauseBtn.textContent = "Play";
}

const nu = window.innerWidth < 720 ? 360 : 520;
const nv = window.innerWidth < 720 ? 64 : 88;
const strip = buildStrip(nu, nv);

const geometry = new THREE.BufferGeometry();
geometry.setAttribute("position", new THREE.BufferAttribute(strip.positions, 3));
geometry.setAttribute("aU", new THREE.BufferAttribute(strip.paramU, 1));
geometry.setAttribute("aV", new THREE.BufferAttribute(strip.paramV, 1));
geometry.setIndex(new THREE.BufferAttribute(strip.indices, 1));
geometry.computeBoundingSphere();

const pixels = new Uint8Array(256 * 4);
for (let i = 0; i < 256; i++) {
  const [r, g, b] = twilight(i / 256);
  pixels[i * 4] = Math.round(r * 255);
  pixels[i * 4 + 1] = Math.round(g * 255);
  pixels[i * 4 + 2] = Math.round(b * 255);
  pixels[i * 4 + 3] = 255;
}
const texture = new THREE.DataTexture(pixels, 256, 1, THREE.RGBAFormat);
texture.colorSpace = THREE.SRGBColorSpace;
texture.wrapS = THREE.RepeatWrapping;
texture.wrapT = THREE.ClampToEdgeWrapping;
texture.magFilter = THREE.LinearFilter;
texture.minFilter = THREE.LinearFilter;
texture.generateMipmaps = false;
texture.needsUpdate = true;

const material = new THREE.ShaderMaterial({
  uniforms: {
    uPhase: { value: 0 },
    uMap: { value: texture },
  },
  vertexShader,
  fragmentShader,
  side: THREE.DoubleSide,
  toneMapped: false,
});

const mesh = new THREE.Mesh(geometry, material);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03040b);
scene.add(mesh);

const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 40);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
} catch (err) {
  stage.innerHTML =
    '<p style="padding:2rem;color:#e7e4da;font:1rem/1.5 system-ui">WebGL is needed for the strip and is not available here.<br><span style="color:#9b97a6;font-size:0.875rem">' +
    String((err && err.message) || err) +
    "</span></p>";
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.domElement.setAttribute("aria-label", "A Möbius strip turning slowly, coloured by a wave on its surface");
renderer.domElement.setAttribute("role", "img");
stage.appendChild(renderer.domElement);

let azimuth = INITIAL_AZIMUTH;
let polar = INITIAL_POLAR;
let zoom = 1;
let spinAngle = 0.4;
let phase = 0;
let baseDist = 4;
let lookY = -0.08;
let last = performance.now();
let halted = false;
let dragging = false;
let resetView = false;
const pointers = new Map();
let pinch = 0;
const look = new THREE.Vector3();

function clamp(v, lo, hi) {
  return Math.min(hi, Math.max(lo, v));
}

function frameDistance() {
  const aspect = camera.aspect;
  const halfY = Math.tan((camera.fov * Math.PI) / 360);
  const halfX = halfY * Math.max(aspect, 0.2);
  const extent = 1.82;
  baseDist = Math.max(extent / halfY, extent / halfX) * (aspect < 0.9 ? 1.28 : 1.08);
  lookY = aspect < 0.9 ? -0.95 : -0.62;
}

function placeCamera() {
  const dist = baseDist * zoom;
  const y = dist * Math.cos(polar);
  const radial = dist * Math.sin(polar);
  camera.position.set(radial * Math.sin(azimuth), y, radial * Math.cos(azimuth));
  look.set(0, lookY, 0);
  camera.lookAt(look);
}

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  if (w < 2 || h < 2) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  frameDistance();
  renderer.setSize(w, h, false);
  placeCamera();
}

function renderFrame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (resetView) {
    resetView = false;
    azimuth = INITIAL_AZIMUTH;
    polar = INITIAL_POLAR;
    zoom = 1;
  }

  if (!settings.paused && !dragging) {
    spinAngle += settings.spin * dt;
    phase += settings.flow * dt;
  }

  mesh.rotation.y = spinAngle;
  material.uniforms.uPhase.value = phase;
  placeCamera();
  renderer.render(scene, camera);

  if (settings.paused && !dragging) {
    renderer.setAnimationLoop(null);
    halted = true;
  }
}

function kick() {
  if (!halted) return;
  last = performance.now();
  halted = false;
  renderer.setAnimationLoop(renderFrame);
}

function pinchDistance() {
  const pts = [...pointers.values()];
  if (pts.length < 2) return 0;
  return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
}

function onPointerDown(e) {
  if (e.target.closest && e.target.closest(".panel, header, button, input")) return;
  renderer.domElement.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  dragging = true;
  pinch = pointers.size >= 2 ? pinchDistance() : 0;
  kick();
}

function onPointerMove(e) {
  const prev = pointers.get(e.pointerId);
  if (!prev) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    azimuth -= (e.clientX - prev.x) * 0.0052;
    polar = clamp(polar + (e.clientY - prev.y) * 0.0046, 0.22, Math.PI - 0.22);
  } else if (pointers.size >= 2) {
    const d = pinchDistance();
    if (pinch > 0 && d > 0) zoom = clamp(zoom * (pinch / d), 0.62, 2.5);
    pinch = d;
  }
}

function onPointerUp(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = 0;
  dragging = pointers.size > 0;
  if (!dragging && settings.paused) {
    placeCamera();
    renderer.render(scene, camera);
  }
}

function onWheel(e) {
  if (e.target.closest && e.target.closest(".panel, header, button, input")) return;
  e.preventDefault();
  const scale = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;
  zoom = clamp(zoom * Math.exp(e.deltaY * scale * 0.0011), 0.62, 2.5);
  kick();
  if (halted) {
    placeCamera();
    renderer.render(scene, camera);
  }
}

const canvas = renderer.domElement;
canvas.addEventListener("pointerdown", onPointerDown);
canvas.addEventListener("pointermove", onPointerMove);
canvas.addEventListener("pointerup", onPointerUp);
canvas.addEventListener("pointercancel", onPointerUp);
canvas.addEventListener("wheel", onWheel, { passive: false });
window.addEventListener("resize", () => {
  resize();
  kick();
  if (settings.paused) {
    placeCamera();
    renderer.render(scene, camera);
  }
});

resize();
renderer.setAnimationLoop(renderFrame);
  </script>
</body>
</html>
